<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Verifier</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f6f7f9; color: #1b1f24; }
    main { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: #57606a; margin: 0 0 20px; }
    .card { background: #fff; border: 1px solid #d8dee4; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Document Verifier</h1>
    <p class="sub">Upload a CV and an Aadhaar or PAN card. The UI lands in Phase 3; the API is at <a href="/docs">/docs</a>.</p>
    <div class="card" id="health">Checking service…</div>
  </main>
  <script>
    fetch('/health').then(r => r.json()).then(h => {
      document.getElementById('health').textContent =
        `OCR: ${h.ocr_engine} · LLM: ${h.llm.enabled ? h.llm.model : 'off (regex only)'} · similarity: ${h.matching.backend}`;
    }).catch(() => { document.getElementById('health').textContent = 'Service unreachable.'; });
  </script>
</body>
</html>
