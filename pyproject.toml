[project]
name = "document-verifier"
version = "0.1.0"
description = "Resume extraction + Aadhaar/PAN OCR + name verification service (prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "PyPDF2==3.0.1",
    "python-docx>=1.1",
    "scikit-learn>=1.5",
    "numpy>=1.26,<2.4",
    "rapidfuzz>=3.10",
    "pillow>=10.4",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# PaddleOCR's PP-OCR pipeline. paddlepaddle 3.0.0 is the last release with a
# macOS x86_64 wheel and cannot load the current models, so on an Intel Mac
# the pipeline runs its ONNX models on onnxruntime (OCR_INFERENCE_ENGINE=auto).
ocr = [
    "paddleocr>=3.7",
    "onnxruntime>=1.20",
    "paddlepaddle==3.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "paddlepaddle>=3.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
nlp = ["spacy>=3.8"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "paddle: needs a real PaddleOCR install (OCR_ENGINE=pp-ocrv5)",
    "ollama: needs a running Ollama with the configured model",
]
filterwarnings = [
    "ignore::DeprecationWarning:PyPDF2.*",
    "ignore::DeprecationWarning:reportlab.*",
]

[tool.uv]
package = false
# Resolve to versions that have wheels for an Intel Mac too (onnxruntime
# dropped macOS x86_64 wheels in 1.24).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
